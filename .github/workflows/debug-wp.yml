# Temporary: renders both tracker pages in Chrome and reports errors. Safe to delete.
name: debug-wp (temporary)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1
      - env:
          WP_URL: ${{ secrets.WP_URL }}
        run: |
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          base = os.environ["WP_URL"].rstrip("/")
          pages = {"ow9": ("/bse-order-wins-tracker-companies-that-bagged-new-orders-this-week/", "ow-upd", "ow-rows"),
                   "sm9": ("/nse-bulk-and-block-deals-tracker/", "sm9-upd", "sm9-rows")}
          with sync_playwright() as p:
              b = p.chromium.launch()
              for root, (path, upd, rows) in pages.items():
                  for vw in ((1280, 900), (390, 844)):
                      pg = b.new_page(viewport={"width": vw[0], "height": vw[1]}); logs = []
                      pg.on("pageerror", lambda e: logs.append(f"PAGEERROR: {e}"[:300]))
                      pg.on("console", lambda m: logs.append(f"console.{m.type}: {m.text}"[:200]) if m.type == "error" else None)
                      pg.goto(base + path + "?chk=" + str(os.getpid()), wait_until="networkidle", timeout=90000)
                      pg.wait_for_timeout(5000)
                      info = pg.evaluate(f"""() => {{ const r=document.getElementById('{root}'); if(!r) return 'NO ROOT';
                        return 'updated='+(document.getElementById('{upd}')||{{}}).textContent+' | table rows='+document.querySelectorAll('#{rows} tr').length+
                          ' | canvases='+r.querySelectorAll('canvas').length+' | css loaded='+(getComputedStyle(r).borderRadius)+' | h1='+(r.querySelector('h1')||{{}}).textContent.slice(0,80) }}""")
                      print(f"===== {root} {vw[0]}px: {info}")
                      for l in logs[:10]: print("   ", l)
                      pg.close()
              b.close()
          PY
