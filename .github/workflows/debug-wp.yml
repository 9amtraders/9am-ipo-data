# Temporary: finds what WordPress changes inside the tracker script. Safe to delete.
name: debug-wp (temporary)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          WP_URL: ${{ secrets.WP_URL }}
        run: |
          curl -sS -A "Mozilla/5.0" "${WP_URL%/}/bse-order-wins-tracker-companies-that-bagged-new-orders-this-week/?dbg=$RANDOM" -o live.html
          python3 - <<'PY'
          import re, subprocess
          h = open("live.html", encoding="utf-8", errors="replace").read()
          i = h.find('var DATA_URL="https://raw.githubusercontent.com/9amtraders/9am-ipo-data/main/orders/orders.json"')
          a = h.rfind("<script>", 0, i); b = h.find("</script>", i)
          js = h[a + 8:b]
          open("t.js", "w").write(js)
          r = subprocess.run(["node", "--check", "t.js"], capture_output=True, text=True)
          print("NODE:", r.stderr[:900])
          m = re.search(r"t\.js:(\d+)", r.stderr)
          if m:
              ln = int(m.group(1)); lines = js.split("\n")
              print("LINE", ln, ":", lines[ln - 1][:600])
          for pat in ["<p>", "</p>", "<br />", "&#8217;", "&#8220;", "&#8221;", "&#038;", "&amp;&amp;", "&#8211;", "&lt;", "<img", "data:image"]:
              print(f"count {pat!r}: {js.count(pat)}")
          st = h[h.rfind("<style>", 0, h.find("#ow9 .b-govt")):h.find("</style>", h.find("#ow9 .b-govt"))]
          print("style block <p>/<br>:", st.count("<p>"), st.count("<br"))
          for m in list(re.finditer(r"<p>|<br ?/?>|&#82\d\d;", js))[:6]:
              print("CONTEXT:", repr(js[max(0, m.start() - 120): m.end() + 60]))
          PY
