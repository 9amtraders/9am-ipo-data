# Temporary: checks how the two tracker pages render in Chrome. Safe to delete.
name: debug-wp (temporary)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1
      - env:
          WP_URL: ${{ secrets.WP_URL }}
        run: |
          mkdir -p shots
          python3 - <<'PY'
          import os, re
          from playwright.sync_api import sync_playwright
          base = os.environ["WP_URL"].rstrip("/")
          pages = {"orders": "/bse-order-wins-tracker-companies-that-bagged-new-orders-this-week/",
                   "deals": "/nse-bulk-and-block-deals-tracker/"}
          with sync_playwright() as p:
              b = p.chromium.launch()
              for name, path in pages.items():
                  for vw in ((1280, 900), (390, 844)):
                      pg = b.new_page(viewport={"width": vw[0], "height": vw[1]})
                      logs = []
                      pg.on("console", lambda m: logs.append(f"console.{m.type}: {m.text}"[:300]))
                      pg.on("pageerror", lambda e: logs.append(f"PAGEERROR: {e}"[:400]))
                      pg.on("requestfailed", lambda r: logs.append(f"FAILED: {r.url[:120]} {r.failure}"))
                      pg.goto(base + path + "?dbg=1", wait_until="networkidle", timeout=90000)
                      pg.wait_for_timeout(4000)
                      root = "ow9" if name == "orders" else "sm9"
                      info = pg.evaluate(f"""() => {{ const r=document.getElementById('{root}'); if(!r) return 'NO ROOT';
                        const cs=getComputedStyle(r); const cards=[...r.querySelectorAll('.card')];
                        return 'root display='+cs.display+' vis='+cs.visibility+' opacity='+cs.opacity+' height='+r.offsetHeight+
                          ' | cards='+cards.length+' shown='+cards.filter(c=>c.classList.contains('in')).length+
                          ' | upd='+(document.getElementById('{"ow-upd" if name=="orders" else "sm9-upd"}')||{{}}).textContent+
                          ' | scripts in root='+r.querySelectorAll('script').length+' | p-in-style='+[...document.querySelectorAll('style')].filter(s=>/<p>|<br/.test(s.innerHTML)).length; }}""")
                      print(f"===== {name} {vw[0]}px: {info}")
                      for l in logs[:25]: print("   ", l)
                      pg.screenshot(path=f"shots/{name}_{vw[0]}.png", full_page=False)
                      pg.evaluate(f"document.getElementById('{root}') && document.getElementById('{root}').scrollIntoView()")
                      pg.wait_for_timeout(1500)
                      pg.screenshot(path=f"shots/{name}_{vw[0]}_tool.png")
                      html = pg.content()
                      m = re.search(r"<script>\s*\(function\(\)\{.{0,400}", html, re.S)
                      print("    inline script head:", (m.group(0)[:200] if m else "NOT FOUND").replace("\n", " "))
                      pg.close()
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
