# Policy Radar prices
# Works out, for every policy in policy-radar/policies.json, each named stock's close
# on the trading day before the policy vs its latest close (plus Nifty 50 over the same
# period), and writes policy-radar/prices.json for the Policy Radar page on 9amtraders.com.
# Runs every weekday evening after the NSE bhavcopy is out, and whenever the daily
# Claude scan pushes new policies.
name: Policy Radar prices

on:
  schedule:
    - cron: "0 14 * * 1-5"   # 7:30 PM IST, Mon-Fri
  push:
    branches: [main]
    paths: [policy-radar/policies.json, policy-radar/symbols.json, scripts/policy_prices.py]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: policy-radar
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build policy-radar/prices.json
        run: python scripts/policy_prices.py

      - name: Commit data
        run: |
          git config user.name  "9am-bot"
          git config user.email "actions@users.noreply.github.com"
          git add policy-radar/prices.json
          git diff --cached --quiet || git commit -m "Policy Radar prices $(date -u +%F)"
          git pull --rebase
          git push
