<style>
.smp{--navy:#0f1f4b;--ink:#14182a;--mut:#5b6278;--line:#e3e6ee;--bg:#f3f5f9;--red:#c62832;--grn:#14845a;--gold:#b98a1f;--card:#fff;
 font-family:"Archivo",Inter,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px}
.smp *{box-sizing:border-box}
.smp a{color:var(--navy)}
.smp h1,.smp h2,.smp h3{font-family:"Archivo",Inter,Arial,sans-serif;letter-spacing:-.02em;margin:0;color:var(--navy);text-transform:none}
.smp .w{max-width:1100px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:22px}
.smp .crumb{font:500 13px/1.4 "JetBrains Mono",monospace;color:var(--mut)}
.smp .crumb a{color:var(--mut)}
/* hero */
.smp .hero{position:relative;overflow:hidden;border-radius:20px;background:radial-gradient(700px 300px at 100% 0,rgba(198,40,50,.35),transparent 70%),linear-gradient(140deg,#0f1f4b,#081130);color:#fff;padding:28px}
.smp .hero::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 10px);pointer-events:none}
.smp .hrow{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.smp .av{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;font:900 38px/1 Archivo,Inter,sans-serif;color:#fff;background:linear-gradient(135deg,#c62832,#7a1220);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 12px 30px -10px rgba(0,0,0,.6)}
.smp .tag{display:inline-flex;gap:8px;align-items:center;font:700 11.5px/1 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#dfe4f5;padding:6px 10px;border:1px solid rgba(255,255,255,.25);border-radius:999px}
.smp .tag i{width:8px;height:8px;border-radius:50%;background:#2fe07a}
.smp .hero h1{color:#fff;font-size:clamp(28px,4.6vw,44px);font-weight:900;margin:10px 0 4px}
.smp .hero p{margin:0;color:#c3cbe6;max-width:640px}
.smp .stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:22px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.14)}
.smp .stats div{background:rgba(8,17,48,.6);padding:14px 16px}
.smp .stats small{display:block;font:600 11px/1.2 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#9fabd3}
.smp .stats b{display:block;font:900 24px/1.15 Archivo,Inter,sans-serif;color:#fff;margin-top:6px}
.smp .stats span{display:block;font-size:12.5px;color:#aeb8d8;margin-top:2px}
/* badges */
.smp .ex,.smp .es,.smp .nd{display:inline-block;font:700 10.5px/1 "JetBrains Mono",monospace;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:6px;white-space:nowrap}
.smp .ex{background:#e3f4ec;color:#0e6b47}.smp .es{background:#fdf1d8;color:#8a5a00}.smp .nd{background:#eef0f5;color:#5b6278}
.smp .legend{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
/* sections */
.smp .sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.smp .sec h2{font-size:clamp(21px,3vw,26px);font-weight:800;margin-bottom:6px}
.smp .lede{margin:0 0 16px;color:var(--mut);max-width:760px}
.smp .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.smp table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:680px}
.smp th,.smp td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.smp thead th{font:700 11px/1.2 "JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--navy);white-space:nowrap}
.smp td.n,.smp th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.smp tbody tr{transition:background .2s}.smp tbody tr:hover{background:#f7f8fb}
.smp .buy,.smp .sell{font:800 12px/1 Archivo,sans-serif;padding:5px 8px;border-radius:6px;white-space:nowrap}
.smp .buy{background:#e3f4ec;color:#0e6b47}.smp .sell{background:#fde8e9;color:#a3141e}
.smp .up{color:var(--grn);font-weight:700}.smp .dn{color:var(--red);font-weight:700}
.smp .chip{display:inline-block;font:700 11.5px/1 Archivo,sans-serif;padding:5px 8px;border-radius:999px;white-space:nowrap}
.smp .c-new{background:#e6eefc;color:#1f4fbf}.smp .c-add{background:#e3f4ec;color:#0e6b47}.smp .c-cut{background:#fde8e9;color:#a3141e}.smp .c-same{background:#eef0f5;color:#5b6278}.smp .c-out{background:#2a2f45;color:#fff}
.smp .note{font-size:13px;color:var(--mut);margin:12px 0 0}
/* P&L cards */
.smp .pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.smp .plc{border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.smp .plc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#5b6278)}
.smp .plc.pos{--c:var(--grn)}.smp .plc.neg{--c:var(--red)}.smp .plc.neu{--c:var(--navy)}
.smp .plc h3{font-size:17px;font-weight:800;margin:0 0 2px}
.smp .plc .k{font-size:13px;color:var(--mut)}
.smp .plc .big{font:900 28px/1.1 Archivo,Inter,sans-serif;margin:10px 0 2px}
.smp .plc.pos .big{color:var(--grn)}.smp .plc.neg .big{color:var(--red)}.smp .plc.neu .big{color:var(--navy)}
.smp .plc .m{font-size:13px;color:var(--mut)}
/* changes */
.smp .chg4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.smp .cq{border-radius:14px;padding:14px;border:1px solid var(--line)}
.smp .cq b{display:block;font:800 13px/1 "JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.smp .cq ul{margin:0;padding:0;list-style:none;font-size:14px}.smp .cq li{padding:4px 0;border-bottom:1px dashed var(--line)}
.smp .cq li:last-child{border:0}
.smp .q-new b{color:#1f4fbf}.smp .q-add b{color:var(--grn)}.smp .q-cut b{color:var(--red)}.smp .q-out b{color:var(--ink)}
/* timeline chart */
.smp .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:end;height:220px;padding:10px 4px 0;border-bottom:2px solid var(--line)}
.smp .bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.smp .bar i{display:block;width:min(110px,70%);border-radius:10px 10px 0 0;background:linear-gradient(180deg,#24398a,#0f1f4b);height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.smp .bar:last-child i{background:linear-gradient(180deg,#e0434c,#a3141e)}
.smp .bar b{font:900 18px Archivo,sans-serif;color:var(--navy);margin-bottom:6px}
.smp .bl{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;text-align:center;font:600 13px/1.3 "JetBrains Mono",monospace;color:var(--mut);margin-top:8px}
/* news + sources */
.smp .news{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.smp .nw{display:block;text-decoration:none!important;border:1px solid var(--line);border-radius:12px;padding:13px 14px;transition:border-color .2s,transform .2s}
.smp .nw:hover{border-color:var(--navy);transform:translateY(-2px)}
.smp .nw small{display:block;font:600 11.5px "JetBrains Mono",monospace;color:var(--mut);margin-bottom:4px}
.smp .nw b{display:block;font-size:15px;color:var(--ink);line-height:1.35}
.smp .src{margin:0;padding-left:18px;font-size:14px}.smp .src li{margin:4px 0}
.smp .disc{font-size:12.5px;color:var(--mut);margin:0;line-height:1.55}
.smp .cta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center;border-radius:16px;padding:20px 22px;background:var(--navy);color:#fff}
.smp .cta h2{color:#fff;font-size:22px}.smp .cta p{margin:4px 0 0;color:#c3cbe6}
.smp .cta a{display:inline-flex;gap:8px;align-items:center;text-decoration:none;font:800 15px Archivo,sans-serif;padding:13px 20px;border-radius:999px;background:#1faa52;color:#fff!important}
.smp .faq{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.smp .q{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.smp .q h3{font-size:16px;font-weight:800;margin:0 0 6px}.smp .q p{margin:0;font-size:14.5px;color:var(--mut)}
/* reveal */
.smp.js .rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0s)}
.smp.js .rv.in{opacity:1;transform:none}
@media(max-width:820px){.smp .stats{grid-template-columns:1fr 1fr}.smp .chg4{grid-template-columns:1fr 1fr}.smp .faq{grid-template-columns:1fr}.smp .hrow{grid-template-columns:1fr}.smp .av{width:72px;height:72px;font-size:28px;border-radius:18px}.smp .sec{padding:18px 14px}.smp .hero{padding:22px 18px}}
@media(max-width:420px){.smp .chg4{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.smp.js .rv{opacity:1;transform:none;transition:none}.smp .bar i{transition:none}}
</style>
